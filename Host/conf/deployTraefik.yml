# Compose file for deploying the Traefik proxy on Swarm.
# docker stack deploy --compose-file=compose/deployTraefik.yml

version: "3.9"
services:
  traefik:
    image: traefik:v3.2.3
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_certs:/letsencrypt
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.email=your-email@example.com" # Replace with your email
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"  # Enable HTTP-01 challenge
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web" # Use the 'web' entrypoint for the challenge
      - "--entrypoints.websecure.http.tls.certresolver=myresolver"
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - traefik-link
networks:
  traefik-link:
    external: true
    
